<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Press+Start+2P&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="shortcut icon" href="assets/img/favicon.jpg" />
    <script src="assets/engine.js" defer></script>
    <title>Detona Ralph</title>
  </head>
  <body>
    <header>
      <div id="menu">
        <div class="menuTime">
          <h2>Time Left</h2>
          <h2 id="timeLeft">0</h2>
        </div>

        <div class="menuScore">
          <h2>Your Score</h2>
          <h2 id="score">0</h2>
        </div>

        <div class="menuLives">
          <img src="assets/img/player.png" alt="foto do jogador" />
          <h2>x<span id="life">3</span></h2>
        </div>
      </div>
    </header>

    <main>
      <div id="panel">
        <div class="panel-row">
          <div class="square" id="1"></div>
          <div class="square" id="2"></div>
          <div class="square" id="3"></div>
        </div>

        <div class="panel-row">
          <div class="square" id="4"></div>
          <div class="square" id="5"></div>
          <div class="square" id="6"></div>
        </div>

        <div class="panel-row">
          <div class="square" id="7"></div>
          <div class="square" id="8"></div>
          <div class="square" id="9"></div>
        </div>
      </div>
    </main>

    <footer>
      <a href="https://www.linkedin.com/in/jo%C3%A3obelizariodev/">
        Desenvolvido por : BelizarioJv
      </a>
    </footer>
  </body>
</html>
